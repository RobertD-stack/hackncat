name: hackncat
description: "A new Flutter project."

publish_to: "none" # Set this to "none" to prevent accidental publishing

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.11.1
  path_provider: ^2.0.8
  path: ^1.9.1
  get: ^4.7.2
  permission_handler: ^11.4.0
  image: ^4.5.4
  process_run: ^0.12.5+3
  image_picker: ^0.8.4+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/EcoSnap Logo.png
    - assets/EcoSnap Retro.png
    - assets/ecosnap8bitwhite.png

  fonts:
    - family: Silkscreen
      fonts:
        - asset: fonts/Silkscreen-Regular.ttf

  uses-material-design: true
